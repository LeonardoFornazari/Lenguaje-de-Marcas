<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Lista de precios</title>
</head>
<body>
    <h1>Menú de nuestra cafetería</h1>
    <table style="border: 1px solid black; border-collapse: collapse;">
        <tr>
            <th colspan="3" style="border: 1px solid black; background-color: lightblue;">
                Desayunos
            </th>
        </tr>
        <tr>
            <th style="border: 1px solid black;">Producto</th>
            <th style="border: 1px solid black;">Tamaño</th>
            <th style="border: 1px solid black;">Precio</th>
        </tr>
        <tr style="background-color: lightyellow;">
            <td rowspan="2" style="border: 1px solid black;">Café</td>
            <td style="border: 1px solid black;">Pequeño</td>
            <td style="border: 1px solid black;">1,20 €</td>
        </tr>
        <tr style="background-color: white;">
            <td style="border: 1px solid black;">Grande</td>
            <td style="border: 1px solid black;">1,80 €</td>
        </tr>
        <tr>
            <th colspan="3" style="border: 1px solid black; background-color: lightblue;">
                Bebidas
            </th>
        </tr>
        <tr style="background-color: lightyellow;">
            <td style="border: 1px solid black;">Zumo de naranja</td>
            <td style="border: 1px solid black;">Normal</td>
            <td style="border: 1px solid black;">2,00 €</td>
        </tr>
        <tr style="background-color: white;">
            <td style="border: 1px solid black;">Agua</td>
            <td style="border: 1px solid black;">Pequeña</td>
            <td style="border: 1px solid black;">1,00 €</td>
        </tr>
        <tr>
            <td colspan="2" style="border: 1px solid black; background-color: lightblue;">
                Precios con IVA incluido
            </td>
            <td style="border: 1px solid black;">€</td>
        </tr>

    </table>
</body>
</html>
