<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Tarjeta de producto</title>
</head>
<body>
    <h1>Nuestra tienda online</h1>
    <div>
        <!-- Imagen local: está guardada en nuestra carpeta img. Elegiría esta opción para asegurar que la imagen esté disponible aunque no tengamos conexión a Internet. -->
        <img src="img/mochila.jpg" alt="Mochila para portátil de color oscuro con varios compartimentos" width="300" height="300" style="border: 2px solid black;">
        <!-- Imagen remota: está alojada en un servidor de Internet. Elegiría esta opción para utilizar imágenes o iconos sin tener que guardarlos en nuestro proyecto. -->
        <img src="https://img.icons8.com/fluency/48/discount.png" alt="Sello de descuento que indica que el producto está en oferta" width="70" height="70">
        <h2>Mochila para portátil</h2>
        <p>Precio anterior: <del>49,99 €</del></p>
        <p>Precio actual: <strong>34,99 €</strong></p>
        <p>
            Mochila cómoda y resistente, ideal para transportar un ordenador portátil.
            Cuenta con varios compartimentos para guardar accesorios y objetos personales.
        </p>
    </div>
</body>
</html>
